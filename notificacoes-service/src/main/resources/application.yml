spring:
  application:
    name: notificacoes-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5435/notificacoes_db}
    username: ${DB_USER:safer}
    password: ${DB_PASSWORD:safer}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  mail:
    # MailHog em desenvolvimento (SMTP 1025, interface web 8025).
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

server:
  port: 8084

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

safer:
  email:
    remetente: ${SAFER_EMAIL_REMETENTE:safer@ufrpe.br}

management:
  endpoints:
    web:
      exposure:
        include: health
