server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/geocoding/ {
        proxy_pass http://geocodificacao-service:8083/geocoding/;
    }

    location /api/ocorrencias {
        proxy_pass http://ocorrencias-service:8082/ocorrencias;
    }

    location /api/auth {
        proxy_pass http://usuarios-service:8081/auth;
    }

    location /api/usuarios {
        proxy_pass http://usuarios-service:8081/usuarios;
    }
}
