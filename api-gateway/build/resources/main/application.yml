spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            # O prefixo /api é removido; o destino é resolvido no Eureka (lb://).
            - id: usuarios
              uri: lb://usuarios-service
              predicates:
                - Path=/api/usuarios/**,/api/auth/**
              filters:
                - StripPrefix=1
            - id: ocorrencias
              uri: lb://ocorrencias-service
              predicates:
                - Path=/api/ocorrencias/**
              filters:
                - StripPrefix=1

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health
