spring:
  application:
    name: usuarios-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/usuarios_db}
    username: ${DB_USER:safer}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: 8081

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

safer:
  admin:
    # Primeiro administrador, criado ao subir se ainda não existir (ver AdministradorInicial).
    email: ${ADMIN_EMAIL:}
    senha: ${ADMIN_SENHA:}

# Documentação interativa da API (Swagger). Desligada por padrão: ela descreve toda a API.
# Para ligar ao rodar o serviço localmente: SWAGGER_ENABLED=true
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
