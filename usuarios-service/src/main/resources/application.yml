spring:
  application:
    name: usuarios-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/usuarios_db}
    username: ${DB_USER:safer}
    password: ${DB_PASSWORD:safer}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  port: 8081

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health
