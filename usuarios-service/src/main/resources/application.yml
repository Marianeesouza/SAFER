spring:
  application:
    name: usuarios-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/usuarios_db}
    username: ${DB_USER:safer}
    password: ${DB_PASSWORD:safer}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: 8081

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health

jwt:
  secret: ${JWT_SECRET:safer-ufrpe-secret-key-with-at-least-256-bits-for-hs256-signing}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

safer:
  admin:
    # Primeiro administrador, criado ao subir se ainda não existir (ver AdministradorInicial).
    email: ${ADMIN_EMAIL:}
    senha: ${ADMIN_SENHA:}
