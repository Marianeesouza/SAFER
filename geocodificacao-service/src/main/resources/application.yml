spring:
  application:
    name: geocodificacao-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5436/geocodificacao_db}
    username: ${DB_USER:safer}
    password: ${DB_PASSWORD:safer}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  port: 8083

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

safer:
  nominatim:
    url: ${NOMINATIM_URL:https://nominatim.openstreetmap.org}
    user-agent: safer-geocoding/0.1 (UFRPE)
  map:
    url-template: https://tile.openstreetmap.org/{z}/{x}/{y}.png
    attribution: "© OpenStreetMap contributors"
    max-zoom: 19

management:
  endpoints:
    web:
      exposure:
        include: health
