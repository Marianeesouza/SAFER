spring:
  application:
    name: ocorrencias-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/ocorrencias_db}
    username: ${DB_USER:safer}
    password: ${DB_PASSWORD:safer}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

server:
  port: 8082

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health
