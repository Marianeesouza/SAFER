spring:
  application:
    name: ocorrencias-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/ocorrencias_db}
    username: ${DB_USER:safer}
    password: ${DB_PASSWORD:safer}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

server:
  port: 8082

jwt:
  secret: ${JWT_SECRET:super-secret-key-safer-ufrpe-development-environment-2024}

safer:
  services:
    geocodificacao-url: ${GEOCODING_URL:http://localhost:8083}
    usuarios-url: ${USUARIOS_SERVICE_URL:http://usuarios-service}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health
